<!DOCTYPE html>
<html lang="fr" class="dark"> {/* Added class="dark" */}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Détection de visages en temps réel</title>
    {/* Removed Bootstrap CSS link */}
    {/* Removed inline <style> block */}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/output.css') }}"> {/* Added Tailwind CSS link */}
</head>
<body class="bg-background text-foreground"> {/* Added Tailwind classes to body */}
    <div class="container mx-auto p-4 md:p-8"> {/* Added Tailwind classes to main container */}
        <!-- En-tête -->
        <div class="text-center mb-8"> {/* Added Tailwind classes to header div */}
            <h1 class="text-4xl font-bold tracking-tight lg:text-5xl mb-2">Détection de visages en temps réel</h1> {/* Added Tailwind classes to h1 */}
            <p class="text-xl text-muted-foreground">Surveillance en direct avec détection de visages et alertes par e-mail.</p> {/* Added Tailwind classes to lead paragraph */}
        </div>

        <!-- Conteneur vidéo -->
        <div class="bg-muted rounded-lg overflow-hidden shadow-lg mb-6"> {/* Added Tailwind classes to video-container */}
            <img src="{{ url_for('video_feed') }}" alt="Flux vidéo" class="w-full h-auto"> {/* Ensured w-full h-auto */}
        </div>

        <!-- Boutons de contrôle -->
        <div class="text-center space-x-4 mt-4"> {/* Simplified and added space-x for button spacing */}
            {/* Replaced with Tailwind-styled button, preserving ID */}
            <button id="start-btn" class="inline-flex items-center justify-center rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 bg-primary text-primary-foreground hover:bg-primary/90 h-10 px-4 py-2">Démarrer la détection</button>
            {/* Replaced with Tailwind-styled button (destructive variant), preserving ID */}
            <button id="stop-btn" class="inline-flex items-center justify-center rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 bg-destructive text-destructive-foreground hover:bg-destructive/90 h-10 px-4 py-2">Arrêter la détection</button>
        </div>

        <!-- Statut de la détection -->
        <div class="text-center mt-3"> {/* Restyled status container */}
            <p id="status" class="text-sm text-muted-foreground">Statut : Détection active</p> {/* Restyled status paragraph */}
        </div>
    </div>

    <!-- Pied de page -->
    <div class="text-center mt-12 py-6 border-t border-border"> {/* Restyled footer */}
        <p class="text-sm text-muted-foreground">&copy; 2023 Détection de visages. Tous droits réservés.</p> {/* Restyled footer paragraph */}
    </div>

    {/* Removed Bootstrap JS and Popper JS */}
    <!-- Script pour gérer les boutons (remains unchanged) -->
    <script>
        document.getElementById('start-btn').addEventListener('click', function() {
            fetch('/start_detection')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('status').textContent = "Statut : Détection active";
                });
        });

        document.getElementById('stop-btn').addEventListener('click', function() {
            fetch('/stop_detection')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('status').textContent = "Statut : Détection arrêtée";
                });
        });
    </script>
</body>
</html>
